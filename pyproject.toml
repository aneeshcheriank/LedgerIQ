[project]
name = "ledgeriq"
version = "0.1.0"
description = "Project LedgerIQ is an enterprise-grade Financial Retrieval-Augmented Generation (RAG) platform designed to automate complex due diligence across multi-year SEC filings (10-K/10-Q)."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "dotenv>=0.9.9",
    "langchain>=1.3.14",
    "langchain-community>=0.4.2",
    "langchain-deepseek>=1.1.0",
    "langchain-huggingface>=1.2.2",
    "langchain-qdrant>=1.1.0",
    "langchain-text-splitters>=1.1.2",
    "psycopg2-binary>=2.9.12",
    "sentence-transformers>=5.6.1",
]

[dependency-groups]
dev = [
    "ruff>=0.16.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
