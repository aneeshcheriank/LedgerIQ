services:
  # 1. Your Python App / Dev Container
  app:
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - ..:/workspace:cached
    # Keeps the container alive for VS Code connection
    command: sleep infinity
    environment:
      - VECTOR_DB_URL=http://qdrant:6333
      - PG_CONN_STR=postgresql://ledger:ledgerpass@postgres:5432/ledgerdb
      - DOCLING_URL=http://docling:5001
    networks: 
      - dev-network

  # 2. Vector Database (e.g., Qdrant)
  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage
    networks: 
      - dev-network

  # 3. Persistent Storage for Parent Documents & Metadata
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ledger
      POSTGRES_PASSWORD: ledgerpass
      POSTGRES_DB: ledgerdb
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    networks: 
      - dev-network

  # 4. Docling - PDF to Markdown conversion with table extraction
  docling:
    image: quay.io/docling-project/docling-serve-cpu:latest
    ports:
      - "5001:5001"
    volumes:
      - docling_models:/models
    environment:
      - HF_HOME=/models/.cache/huggingface
    networks:
      - dev-network

volumes:
  qdrant_data:
  pg_data:
  docling_models:

networks:
  dev-network:
